[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-src 'self' https://bookwhen.com https://www.openstreetmap.org"

[[redirects]]
  from = "/whats-inside/"
  to = "/whats-inside"
  status = 301

[[redirects]]
  from = "/classes"
  to = "/"
  status = 301

[[redirects]]
  from = "/classes/"
  to = "/"
  status = 301

[[redirects]]
  from = "/send"
  to = "/#sen"
  status = 301

[[redirects]]
  from = "/send/"
  to = "/#sen"
  status = 301

[[redirects]]
  from = "/sen"
  to = "/#sen"
  status = 301

[[redirects]]
  from = "/sen/"
  to = "/#sen"
  status = 301
