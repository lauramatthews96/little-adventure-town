  <text x="800" y="820" text-anchor="middle" fill="#FFFcf6" font-family="system-ui, sans-serif" font-size="28">PHOTO PLACEHOLDER</text>
  <text x="800" y="870" text-anchor="middle" fill="#D9EEF7" font-family="system-ui, sans-serif" font-size="22">Fibre optics, stars, rocket, tactile panels ù 1600 ù 1000</text>
