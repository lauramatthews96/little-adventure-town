    <circle cx="780" cy="80" r="2"/>
    <circle cx="1100" cy="160" r="3"/>
    <circle cx="1400" cy="120" r="2"/>
    <circle cx="250" cy="480" r="2"/>
    <circle cx="1280" cy="420" r="3"/>
    <circle cx="960" cy="300" r="2"/>
    <circle cx="640" cy="360" r="3"/>
  </g>
  <rect x="720" y="420" width="160" height="280" rx="80" fill="#FFFcf6"/>
